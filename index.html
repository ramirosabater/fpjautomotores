<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FPJ Automotores | Comodoro Rivadavia</title><meta name="description" content="FPJ Automotores, Comodoro Rivadavia: venta, permuta y financiación de vehículos. Mirá las unidades disponibles y consultá por WhatsApp."><meta name="theme-color" content="#062B4D"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 26%27%3E%3Cpath d=%27M3 3Q16 -1 29 3L27 17Q16 27 5 17z%27 fill=%27%23053661%27 stroke=%27%23C9D2DC%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fpj-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap">
<style id="fpj-style">
:root{
  --navy:#062B4D; --navy-2:#0B3A66; --navy-deep:#041D35; --shield:#053661;
  --ink:#0B1A2B; --muted:#586A7E; --paper:#EDF1F5; --card:#FFFFFF; --line:#D5DDE6;
  --go:#22C55E; --sky:#1E9BE0; --hot:#E23B2E; --sun:#F5B301;
  --silver:#C9D2DC;
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#D9E0E7 40%,#8E9BAA 52%,#E4E9EE 100%);
  --font:"Archivo","Arial",Helvetica,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--font);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.price{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.1;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-wa{background:#1FB855;color:#fff}
.btn-wa:hover{background:#18A34A}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-chrome{background:var(--chrome);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 1px 0 rgba(0,0,0,.25)}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn-sm{padding:9px 13px;font-size:14px}
.btn-icon{padding:8px;width:40px;height:40px}
.btn-icon svg{width:22px;height:22px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:2px solid var(--silver)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:72px}
.logo{display:block;flex:none;line-height:0}
.logo img{height:52px;width:auto}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font-weight:600;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:15px;color:#DCE5EE}
.nav a:hover{background:var(--navy-2);color:#fff}
@media (max-width:860px){.nav{display:none}.top .btn-wa{margin-left:auto}}
@media (max-width:480px){.logo img{height:44px}.top .btn-wa span{display:none}.top .btn-wa{padding:9px}}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(165deg,var(--navy-2) 0%,var(--navy) 55%,var(--navy-deep) 100%)}
.hero::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-2px;height:38%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.05) 100%);transform:skewY(-4deg);transform-origin:left}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:56px 64px}
.hero h1{font-size:clamp(36px,5.4vw,68px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.98;letter-spacing:-.015em;margin:0 0 18px}
.hero .lead{font-size:19px;color:#C6D3E1;max-width:40ch;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-ghost{color:#fff}
.hero .feat{max-width:440px;justify-self:end;width:100%}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:40px 48px}.hero .feat{justify-self:start}}

/* services strip */
.strip{background:var(--chrome);color:var(--navy);border-block:1px solid #7F8C9B}
.strip .wrap{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;padding-block:14px}
.strip span{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(16px,2.4vw,22px);letter-spacing:.02em}
@media (max-width:480px){.strip .wrap{gap:10px}.strip span{font-size:15px;font-stretch:108%}.strip i{width:7px!important;height:7px!important}}
.strip i{width:9px;height:9px;background:var(--navy);transform:rotate(45deg);display:inline-block}

/* sections */
section.block{padding-block:64px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(32px,4.6vw,52px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1;letter-spacing:-.01em;color:var(--navy)}
.sec-head p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:#fff}

/* offer "story" cards */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.story{position:relative;background:#08111C;color:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 40px -22px rgba(4,29,53,.7)}
.story .media{position:relative;aspect-ratio:4/3;background:#0B1A2B}
.story .media img,.story .media .ph{width:100%;height:100%;object-fit:cover}
.story .media::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(180deg,rgba(8,17,28,0),#08111C)}
.story .body{padding:6px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;flex:1;position:relative;z-index:1}
.story h3{font-size:clamp(20px,2.2vw,25px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1.02}
.story .ver{margin:2px 0 0;color:#D6DEE7;font-weight:600;font-size:15px}
.story .spec{margin:0;color:#9FB0C2;font-size:15px;font-variant-numeric:tabular-nums}
.story .big{font-stretch:125%;font-weight:900;font-size:clamp(56px,6.4vw,76px);line-height:.95;letter-spacing:-.03em;margin-top:12px}
.story .big.ask{font-size:28px;letter-spacing:0;margin-block:18px 8px;color:#D6DEE7}
.story .old{color:#9FB0C2;font-size:15px;text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px}
.band{--b:var(--go);--bt:#04121F;display:block;width:100%;background:var(--b);color:var(--bt);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:15px;letter-spacing:.02em;padding:7px 12px;margin-top:10px}
.story .until{font-size:13px;color:#9FB0C2;margin-top:6px}
.story .actions{display:flex;gap:10px;margin-top:auto;padding-top:18px;width:100%}
.story .actions .btn{flex:1}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
.sticker{position:absolute;right:12px;top:12px;z-index:2;background:var(--hot);color:#fff;font-weight:900;font-stretch:125%;font-size:20px;padding:10px 8px;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;transform:rotate(8deg)}

/* stock */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #B9C5D2;border-radius:10px;padding:2px 6px 2px 14px}
.search:focus-within{border-color:var(--navy)}
.search input{border:0;outline:0;background:transparent;padding:10px 4px;flex:1;min-width:0}
.sort{border:1.5px solid #B9C5D2;border-radius:10px;padding:10px 12px;background:#fff}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #B9C5D2;background:#fff;border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;cursor:pointer;font-size:15px}
.chip i{width:12px;height:12px;border-radius:50%;flex:none}
.chip small{color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:#B9C8D8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.car{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.car:hover{border-color:#9FB0C2}
.car .media{position:relative;aspect-ratio:4/3;background:#DDE4EB}
.car .media img,.car .media .ph{width:100%;height:100%;object-fit:cover}
.car.sold .media img{filter:grayscale(1) brightness(.85)}
.flag{position:absolute;left:10px;top:10px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;background:var(--hot);color:#fff}
.flag.star{background:var(--navy);color:#fff}
.flag.res{background:var(--sun);color:var(--ink)}
.flag.sold{background:var(--ink);color:#fff}
.count{position:absolute;right:10px;bottom:10px;background:rgba(4,18,31,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.car .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.car .cat{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.car .cat i{width:9px;height:9px;border-radius:50%}
.car h3{font-size:20px;font-weight:800;font-stretch:115%;line-height:1.15}
.open{all:unset;cursor:pointer}
.open::after{content:"";position:absolute;inset:0;z-index:1}
.open:focus-visible{outline:none}
.car:has(.open:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.car .ver{margin:-2px 0 0;color:var(--muted);font-size:15px}
.specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.specs span{background:var(--paper);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;color:#334458;font-variant-numeric:tabular-nums}
.car .fin{margin:0;font-size:13px;font-weight:700;color:#12813D}
.car .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.car .pr{font-stretch:125%;font-weight:900;font-size:28px;letter-spacing:-.02em;color:var(--navy)}
.car .pr.ask{font-stretch:100%;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.car .foot .btn{position:relative;z-index:2}
.more{grid-column:1/-1;text-align:center;padding-top:8px}

/* placeholder art */
.ph{--c:var(--navy-2);display:grid;place-items:center;background:linear-gradient(160deg,var(--c),#0A2744);color:#fff}
.ph svg{width:58%;height:auto;opacity:.85}

/* detail modal */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(4,18,31,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg .panel{position:relative;background:#fff;border-radius:18px;width:min(1040px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;display:grid;grid-template-columns:1.25fr 1fr}
.dlg .x{position:absolute;right:12px;top:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gal{background:#0B1A2B;display:flex;flex-direction:column}
.gal .main{position:relative;aspect-ratio:4/3}
.gal .main img,.gal .main .ph{width:100%;height:100%;object-fit:cover}
.gal .nav-b{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;display:grid;place-items:center}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .ctr{position:absolute;left:12px;bottom:12px;background:rgba(4,18,31,.72);color:#fff;font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:none;width:76px;height:57px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none;opacity:.7}
.thumbs button[aria-current="true"]{border-color:#fff;opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px}
.info .cat{font-size:14px;font-weight:600;color:var(--muted)}
.info h2{font-size:clamp(26px,3vw,34px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1;color:var(--navy)}
.info .ver{margin:-4px 0 0;color:var(--muted);font-size:17px}
.info .big{font-stretch:125%;font-weight:900;font-size:48px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.info .full{font-size:14px;color:var(--muted)}
.info .old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px}
.info .band{border-radius:6px;margin:0;width:auto;align-self:flex-start}
.st-note{font-weight:700;padding:8px 12px;border-radius:8px;background:#FFF4D6;color:#6B4E00}
.st-note.sold{background:#EEF1F4;color:var(--ink)}
dl.sp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:4px 0 0;border-top:1px solid var(--line)}
dl.sp div{padding:9px 0;border-bottom:1px solid var(--line)}
dl.sp dt{font-size:13px;color:var(--muted)}
dl.sp dd{margin:0;font-weight:700}
.info .desc{margin:0;white-space:pre-line}
.info .acts{display:grid;gap:10px;margin-top:6px;justify-content:stretch}
.info .acts .btn{width:100%;padding:14px 18px}
.info .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){
  .dlg{padding:0;align-items:stretch}
  .dlg .panel{grid-template-columns:1fr;border-radius:0;max-height:none;height:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg .x{top:calc(10px + env(safe-area-inset-top,0px))}
}

/* financing / trade-in */
.fin-sec .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.fin-card{background:var(--navy);color:#fff;border-radius:18px;padding:32px 30px}
.fin-card h2{font-size:clamp(30px,4vw,44px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1}
.fin-card p{color:#C6D3E1;margin:14px 0 0;font-size:17px;max-width:48ch}
.steps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--chrome);color:var(--navy);display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:20px}
.steps b{display:block;font-size:17px}
.steps span{color:#AFC0D2;font-size:15px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 26px;display:grid;gap:14px}
.form-card h3{font-size:24px;font-weight:800;font-stretch:115%;color:var(--navy)}
.form-card .sub{margin:-8px 0 0;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:14px;font-weight:600;color:#2A3B4F}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #B9C5D2;border-radius:10px;padding:10px 12px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);outline:none}
.field textarea{min-height:88px;resize:vertical}
.err{color:#B3261E;font-weight:600;margin:0;font-size:14px}
@media (max-width:860px){.fin-sec .wrap{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--navy-deep);color:#fff}
.contact .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding-block:60px}
.contact h2{font-size:clamp(32px,5vw,56px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1}
.contact p{color:#C6D3E1;font-size:18px;max-width:42ch}
.cinfo{display:grid;gap:12px;align-content:start}
.cinfo .item{background:var(--navy);border-radius:12px;padding:14px 16px;border:1px solid #16466F}
.cinfo .k{font-size:13px;color:#9FB0C2;font-weight:600}
.cinfo .v{font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copy{background:transparent;border:1.5px solid #3D5F80;color:#DCE5EE;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
@media (max-width:760px){.contact .wrap{grid-template-columns:1fr}}
footer.foot{background:#020F1C;color:#8193A6;font-size:14px}
footer.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px}
footer.foot img{height:40px;width:auto}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;background:#1FB855;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);border:3px solid #fff}
.fab svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}

/* ---------- admin ---------- */
.admin-pill{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sample-note{background:var(--sun);color:var(--ink);font-size:14px;font-weight:600;text-align:center;padding:8px 16px}
.adm{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(4,18,31,.55)}
.adm .panel{width:min(780px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
.adm header{background:var(--navy);color:#fff;padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:grid;gap:12px}
.adm .hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adm .hrow h2{font-size:24px;font-weight:800;font-stretch:125%;text-transform:uppercase;margin-right:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:var(--navy-2);color:#DCE5EE;padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:var(--navy)}
.status{font-size:14px;color:#C6D3E1}
.status.dirty{color:#FFD466}
.status.err{color:#FF9A90}
.adm .content{overflow:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));flex:1;display:grid;gap:14px;align-content:start}
.adm .hint{font-size:14px;color:var(--muted);margin:0}
.arow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px}
.arow .thumb{width:72px;height:54px;border-radius:8px;overflow:hidden;flex:none}
.arow .thumb img,.arow .thumb .ph{width:100%;height:100%;object-fit:cover}
.arow .meta{flex:1;min-width:0}
.arow .meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .meta span{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.form{background:#fff;border:1.5px solid #9FB0C2;border-radius:14px;padding:16px;display:grid;gap:12px}
.form .ftitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.form .ftitle strong{font-size:19px;font-weight:800;font-stretch:115%;color:var(--navy)}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.gedit{display:flex;gap:10px;flex-wrap:wrap}
.gedit .gi{position:relative;width:120px;height:90px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#DDE4EB}
.gedit .gi img{width:100%;height:100%;object-fit:cover}
.gedit .gi .del{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(4,18,31,.8);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.gedit .gi .mk{position:absolute;left:4px;bottom:4px;border:0;border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px;cursor:pointer;background:rgba(255,255,255,.92);color:var(--navy)}
.gedit .gi .mk.on{background:var(--navy);color:#fff;cursor:default}
.gedit .add{display:grid;place-items:center;text-align:center;font-weight:700;color:var(--navy);border:2px dashed #9FB0C2;background:#fff;cursor:pointer;font-size:14px;padding:6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.danger{background:#fff;color:var(--hot);box-shadow:inset 0 0 0 2px var(--hot)}
.danger.solid{background:var(--hot);color:#fff}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#E3E8EE;color:var(--muted)}
.pill.on{background:#D9F5E3;color:#12813D}
.pill.exp{background:#FFE1DE;color:#B3261E}
.pill.res{background:#FFF1C7;color:#6B4E00}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9FB0C2;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--navy)}
</style>

/* ------------------------------ helpers ------------------------------ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function expired(o){ return o.hasta && o.hasta < today(); }
function col(n){ return COLORS[n]||COLORS.navy; }
function catById(id){ for(var i=0;i<state.categorias.length;i++) if(state.categorias[i].id===id) return state.categorias[i]; return state.categorias[0]||{id:"",nombre:"Otros",color:"navy"}; }
function vehById(id){ for(var i=0;i<state.vehiculos.length;i++) if(state.vehiculos[i].id===id) return state.vehiculos[i]; return null; }
function title(v){ return ((v.marca||"")+" "+(v.modelo||"")).trim() || "Vehículo"; }
function fullName(v){ return (title(v)+(v.version?" "+v.version:"")).trim(); }
function src(ref){ if(!ref) return ""; if(ref.indexOf("img:")===0) return IMGS[ref.slice(4)]||""; return ref; }
function fotos(v){ return (v.fotos||[]).map(src).filter(Boolean); }
function num(n){ return Number(n).toLocaleString("es-AR",{maximumFractionDigits:0}); }
function money(n,m){ if(n==null||n===""||isNaN(n)) return ""; return (m==="USD"?"US$ ":"$ ")+num(n); }
function short(n,m){
  if(n==null||n===""||isNaN(n)) return "";
  if(m==="USD") return "US$ "+num(n);
  if(n>=1000000){ var x=n/1000000; return "$"+x.toLocaleString("es-AR",{maximumFractionDigits:(x<100 && Math.round(x*10)!==Math.round(x)*10)?1:0})+"M"; }
  return "$ "+num(n);
}
function kmTxt(v){ if(v.km==null||v.km==="") return ""; return v.km===0?"0 km":num(v.km)+" km"; }
function specLine(v){ return [v.anio, kmTxt(v)].filter(Boolean).join(" | "); }
function visible(v){ return v.estado!=="oculto"; }
function selling(v){ return v.estado!=="oculto" && v.estado!=="vendido"; }
function liveOffers(){ return state.ofertas.filter(function(o){ var v=vehById(o.vehId); return o.activa && !expired(o) && v && selling(v); }); }
function offerFor(vid){ var l=liveOffers(); for(var i=0;i<l.length;i++) if(l[i].vehId===vid) return l[i]; return null; }
function priceOf(v){ var o=offerFor(v.id); if(o && o.ahora) return o.ahora; return v.precio||null; }
function pct(a,b){ if(!a||!b||b>=a) return 0; return Math.round((1-b/a)*100); }
function fmtDate(s){ if(!s) return ""; var p=s.split("-"); return p[2]+"/"+p[1]; }
function bandOf(v,o){ var t=(o&&o.banda)||v.financ||""; var c=(o&&o.bandaColor)||"go"; return t?{t:t,c:c}:null; }
function bandHtml(b){ return b?'<span class="band" style="--b:'+col(b.c)+';--bt:'+(LIGHT_TEXT[b.c]?"#fff":"#04121F")+'">'+esc(b.t)+'</span>':''; }
function wa(text){ var n=(state.settings.whatsapp||"").replace(/\D/g,""); return "https://wa.me/"+n+"?text="+encodeURIComponent(text); }
function slug(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

    else if(im[0]) cover(x,im[0],0,0,W,ph); else { x.fillStyle="#0B3A66"; x.fillRect(0,0,W,ph); }
    var g=x.createLinearGradient(0,ph-200,0,ph); g.addColorStop(0,"rgba(7,13,22,0)"); g.addColorStop(1,"rgba(7,13,22,1)"); x.fillStyle=g; x.fillRect(0,ph-200,W,200);

    y+=p?200:130; x.fillStyle="#fff";

    if(b){ y+=40; var bh=96; x.fillStyle=col(b.c); x.fillRect(110,y,W-220,bh); x.fillStyle=LIGHT_TEXT[b.c]?"#fff":"#04121F"; fitF(x,b.t.toUpperCase(),"800",50,true,W-280); x.textBaseline="middle"; x.fillText(b.t.toUpperCase(),W/2,y+bh/2+3); x.textBaseline="alphabetic"; }
    x.fillStyle="#1FB855"; x.fillRect(0,H-150,W,80); x.fillStyle="#fff"; setF(x,"800",44,true); x.textBaseline="middle"; x.fillText("WHATSAPP: "+(s.whatsappVisible||""),W/2,H-110);
    x.fillStyle="#9FB0C2"; setF(x,"600",30,false); x.fillText("FPJ AUTOMOTORES | "+String(s.ciudad||"").toUpperCase(),W/2,H-38);

function downloadBlob(blob,name){ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function makeStory(vid,oid){
  var v=vehById(vid); if(!v) return; var o=null; state.ofertas.forEach(function(x){ if(x.id===oid) o=x; });
  if(!o) o=offerFor(vid);
  ui.msg="Generando la historia…"; ui.msgType=""; refreshStatus();
  storyImage(v,o).then(function(blob){
    var name="historia-"+slug(fullName(v))+".png";
    var done=function(m){ ui.msg=m; ui.msgType=""; refreshStatus(); };
    if(IS_MOBILE && navigator.share && navigator.canShare){
      var f=null; try{ f=new File([blob],name,{type:"image/png"}); }catch(_){}
      if(f && navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).then(function(){ done("Historia lista."); }, function(e){ if(!e||e.name!=="AbortError"){ downloadBlob(blob,name); done("Se guardó "+name+" en el teléfono."); } else done(""); });
        return;
      }
    }
    downloadBlob(blob,name); done("Se descargó "+name+". Subila como historia en Instagram o WhatsApp.");
  });
}

function field(label,coll,id,key,val,type,extra,full){
  var fid="f-"+coll+"-"+id+"-"+key, inp;
  if(type==="textarea") inp='<textarea id="'+fid+'" data-c="'+coll+'" data-id="'+id+'" data-k="'+key+'">'+esc(val)+'</textarea>';
  else if(type==="select") inp='<select id="'+fid+'" data-c="'+coll+'" data-id="'+id+'" data-k="'+key+'">'+extra.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val==null?"":val)?' selected':'')+'>'+esc(o[1])+'</option>';}).join("")+'</select>';
  else inp='<input id="'+fid+'" type="'+(type||"text")+'" '+(type==="number"?'inputmode="numeric" min="0" step="1"':'')+' data-c="'+coll+'" data-id="'+id+'" data-k="'+key+'" value="'+esc(val==null?"":val)+'"'+(extra?' placeholder="'+esc(extra)+'"':'')+'>';
  return '<div class="field'+(type==="textarea"||full?' full':'')+'"><label for="'+fid+'">'+label+'</label>'+inp+'</div>';
}

function applyBulk(){
  var b=ui.bulk, p=parseFloat(String(b.pct).replace(",",".")); if(!p) return;
  var f=1+p/100, r=parseInt(b.round,10)||1, tg=bulkTargets();
  function adj(x){ return x?Math.max(0,Math.round(x*f/r)*r):x; }
  tg.vs.forEach(function(v){ v.precio=adj(v.precio); });
  tg.ofs.forEach(function(o){ o.antes=adj(o.antes); o.ahora=adj(o.ahora); });
  var n=tg.vs.length+tg.ofs.length; ui.bulk.confirm=false; ui.bulk.pct="";
  afterChange(); ui.msg="Listo: se actualizaron "+n+" precios. Revisalos y descargá el archivo."; refreshStatus();
}

function findItem(c,id){ if(c==="settings") return state.settings; var a=state[c]; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

var NUMS={anio:1,km:1,precio:1,antes:1,ahora:1};
function onInput(e){
  var t=e.target;
  if(t.id==="q"){ ui.q=t.value; ui.limit=12; renderGrid(); return; }
  if(t.id==="sort"){ ui.sort=t.value; renderGrid(); return; }
  if(t.id && t.id.indexOf("pm-")===0){ ui.perm[t.id.slice(3)]=t.value; return; }
  if(t.id && t.id.indexOf("bulk")===0){ var b=ui.bulk; if(t.id==="bulkPct") b.pct=t.value; if(t.id==="bulkRound") b.round=t.value; if(t.id==="bulkInc") b.inc=t.checked; b.confirm=false; var bc=$("#bulkBox"); if(bc) bc.outerHTML=bulkBox(); return; }
  if(t.id==="aq"){ ui.aq=t.value; var l=$("#alist"); if(l) l.innerHTML=admRows(); return; }
  if(!t.dataset || !t.dataset.c || !t.dataset.k) return;
  var it=findItem(t.dataset.c,t.dataset.id); if(!it) return;
  var k=t.dataset.k, v;
  if(t.type==="checkbox") v=t.checked;
  else if(t.type==="number" || NUMS[k]) v=t.value===""?null:Math.max(0,Math.round(Number(t.value)));
  else v=t.value;
  if(t.type==="number" && isNaN(v)) return;
  it[k]=v; ui.msg="";
  if(t.dataset.c==="ofertas" && k==="vehId"){ var nv=vehById(v); if(nv && !it.banda) it.banda=nv.financ||""; }
  refreshStatus();
  if(t.type==="checkbox" || t.tagName==="SELECT"){ renderPublicOnly(); renderAdmin(); focusBack(t.id); }
  else renderPublicSoon();
}

function focusBack(id){ var el=document.getElementById(id); if(el) el.focus(); }
function resizeImage(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){ var img=new Image();
      img.onload=function(){ var max=1280, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
        var ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",0.8)); };
      img.onerror=function(){ res(null); }; img.src=r.result; };
    r.onerror=function(){ res(null); }; r.readAsDataURL(file);
  });
}

function onClick(e){
  var t=e.target.closest("button,[data-act],[data-open]"); if(!t) return;
  if(t.dataset.open){ openDetail(t.dataset.open); return; }
  var a=t.dataset.act;
  if(a==="closebg"){ if(e.target===t) closeDetail(); return; }
  if(a==="close"){ closeDetail(); return; }
  if(a==="gprev"||a==="gnext"){ var n=fotos(vehById(ui.open)).length; ui.gi=(ui.gi+(a==="gnext"?1:-1)+n)%n; renderDetail(); var nb=$(".gal ."+(a==="gnext"?"next":"prev")); if(nb) nb.focus(); return; }
  if(a==="gto"){ ui.gi=+t.dataset.i; renderDetail(); return; }
  if(a==="share"){ shareVeh(t.dataset.id); return; }
  if(a==="permfrom"){ ui.perm.interes=t.dataset.id; closeDetail(); var sel=$("#pm-interes"); if(sel) sel.value=t.dataset.id; var pm=$("#permuta"); if(pm){ pm.scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(function(){ var f=$("#pm-auto"); if(f) f.focus({preventScroll:true}); },450); } return; }
  if(a==="permsend"){ sendPermuta(); return; }
  if(t.dataset.cat){ ui.cat=t.dataset.cat; ui.limit=12; renderCats(); renderGrid(); return; }
  if(a==="more"){ ui.limit+=12; renderGrid(); return; }
  if(t.dataset.copy!=null){ var txt=t.dataset.copy, done=function(){ t.textContent="Copiado"; setTimeout(function(){t.textContent="Copiar";},1500); };
    try{ navigator.clipboard.writeText(txt).then(done,function(){ selectText(t.previousElementSibling); }); }catch(_){ selectText(t.previousElementSibling); } return; }
  if(t.id==="openAdmin"){ ui.adminOpen=true; renderAdmin(); return; }
  if(t.id==="closeAdmin"){ ui.adminOpen=false; ui.editing=null; ui.confirmDel=null; render(); return; }
  if(t.id==="discard"){ state=JSON.parse(saved); imgsDirty=false; ui.editing=null; ui.confirmDel=null; ui.msg=""; try{ localStorage.removeItem(DRAFT_KEY); }catch(_){} render(); return; }
  if(t.id==="publish"){ download(); return; }
  if(t.dataset.tab){ ui.tab=t.dataset.tab; ui.editing=null; ui.confirmDel=null; renderAdmin(); return; }
  if(!a) return;
  var c=t.dataset.c, id=t.dataset.id;
  if(a==="story"){ makeStory(id,t.dataset.o); return; }
  if(a==="bulkask"){ ui.bulk.confirm=true; var bb=$("#bulkBox"); if(bb) bb.outerHTML=bulkBox(); return; }
  if(a==="bulkno"){ ui.bulk.confirm=false; var bb2=$("#bulkBox"); if(bb2) bb2.outerHTML=bulkBox(); return; }
  if(a==="bulkyes"){ applyBulk(); return; }
  if(a==="edit"){ ui.editing=id; ui.confirmDel=null; renderAdmin(); var f=$("#edit-"+id); if(f) f.scrollIntoView({block:"nearest"}); return; }
  if(a==="done"){ ui.editing=null; ui.confirmDel=null; renderAdmin(); return; }
  if(a==="del"){ ui.confirmDel=c+":"+id; renderAdmin(); return; }
  if(a==="del-no"){ ui.confirmDel=null; renderAdmin(); return; }
  if(a==="del-yes"){
    state[c]=state[c].filter(function(x){return x.id!==id;});
    if(c==="vehiculos"){ state.ofertas=state.ofertas.filter(function(o){return o.vehId!==id;}); if(ui.open===id) ui.open=null; }
    if(c==="categorias"){ var first=state.categorias[0].id; state.vehiculos.forEach(function(v){ if(v.cat===id) v.cat=first; }); if(ui.cat===id) ui.cat="all"; }
    ui.confirmDel=null; ui.editing=null; afterChange(); return;
  }
  if(a==="add"){
    if(c==="vehiculos"){ var n={id:uid("v"),marca:"",modelo:"Nuevo vehículo",version:"",anio:null,km:null,cat:(state.categorias[0]||{}).id||"",combustible:"",caja:"",color:"",moneda:"ARS",precio:null,financ:"",estado:"disponible",fotos:[],desc:"",destacado:false}; state.vehiculos.unshift(n); ui.editing=n.id; ui.aq=""; }
    if(c==="ofertas"){ var v0=state.vehiculos.filter(selling)[0]||state.vehiculos[0]; if(!v0){ ui.msg="Primero cargá un vehículo."; refreshStatus(); return; } state.ofertas.unshift({id:uid("o"),vehId:v0.id,antes:v0.precio||null,ahora:null,etiqueta:"Oferta",banda:v0.financ||"",bandaColor:"go",hasta:"",activa:true}); }
    if(c==="categorias"){ state.categorias.push({id:uid("k"),nombre:"Nuevo tipo",color:"slate"}); }
    afterChange(); var sc=$(".adm .content"); if(sc && c!=="categorias") sc.scrollTop=0; return;
  }
  if(a==="color"){ var it=findItem(c,id); if(it){ it[t.dataset.key||"color"]=t.dataset.v; afterChange(); } return; }
  if(a==="fdel"){ var v1=findItem("vehiculos",id); if(v1){ v1.fotos.splice(+t.dataset.i,1); afterChange(); } return; }
  if(a==="fmain"){ var v2=findItem("vehiculos",id); if(v2){ var fm=v2.fotos.splice(+t.dataset.i,1)[0]; v2.fotos.unshift(fm); afterChange(); } return; }
}
function onChange(e){
  var t=e.target;
  if(t.id==="sort"||t.id==="pm-interes"||t.id==="pm-pago"){ onInput(e); return; }
  if(t.dataset && t.dataset.act==="photo" && t.files && t.files.length){
    var v=findItem("vehiculos",t.dataset.id), files=[].slice.call(t.files), ok=0;
    ui.msg="Procesando "+files.length+" foto"+(files.length>1?"s":"")+"…"; ui.msgType=""; refreshStatus();
    files.reduce(function(p,f){ return p.then(function(){ return resizeImage(f).then(function(url){ if(url){ var k=uid("u"); IMGS[k]=url; v.fotos.push("img:"+k); imgsDirty=true; ok++; } }); }); }, Promise.resolve()).then(function(){
      if(!ok){ ui.msg="No se pudo leer esa imagen. Probá con una foto JPG o PNG."; ui.msgType="err"; refreshStatus(); return; }
      afterChange(); if(ok<files.length){ ui.msg=(files.length-ok)+" foto(s) no se pudieron leer."; ui.msgType="err"; refreshStatus(); }
    });
  }
}

/* ------------------------------ download ------------------------------ */
function buildDocument(){
  var json=JSON.stringify(state,null,1).replace(/</g,"\\u003c");
  var keep={logo:IMGS.logo};
  state.vehiculos.forEach(function(v){ (v.fotos||[]).forEach(function(r){ if(r.indexOf("img:")===0 && IMGS[r.slice(4)]) keep[r.slice(4)]=IMGS[r.slice(4)]; }); });
  var SC="<"+"/script>";
  var head=document.documentElement.outerHTML.split("<body")[0];
  return "<!doctype html>\n"+head.replace(/<style id="fpj-style">[\s\S]*?<\/style>/, "<style id=\"fpj-style\">"+document.getElementById("fpj-style").textContent+"</style>")+
    "<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"fpj-data\">"+json+SC+"\n"+
    "<script type=\"application/json\" id=\"fpj-img\">"+JSON.stringify(keep)+SC+"\n"+
    "<script id=\"fpj-app\">"+document.getElementById("fpj-app").textContent+SC+"\n</body></html>";
}
var DRAFT_KEY="fpj-borrador";
function saveDraft(){
  if(!ui.standalone) return;
  try{
    if(!dirty()){ localStorage.removeItem(DRAFT_KEY); return; }
    var mine={}; Object.keys(IMGS).forEach(function(k){ if(k.charAt(0)==="u") mine[k]=IMGS[k]; });
    localStorage.setItem(DRAFT_KEY, JSON.stringify({state:state, imgs:mine}));
  }catch(_){ }
}
function loadDraft(){
  try{
    var d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(!d||!d.state) return;
    state=d.state; Object.keys(d.imgs||{}).forEach(function(k){ IMGS[k]=d.imgs[k]; imgsDirty=true; });
    ui.msg="Recuperamos cambios que no habías descargado."; ui.msgType="";
  }catch(_){ }
}
function download(){
  try{
    var blob=new Blob([buildDocument()],{type:"text/html"});
    downloadBlob(blob,"index.html");
    saved=JSON.stringify(state); imgsDirty=false; try{ localStorage.removeItem(DRAFT_KEY); }catch(_){}
    ui.msg="Listo: se descargó index.html. Subilo a Netlify para que se vean los cambios."; ui.msgType="";
  }catch(err){ ui.msg="No se pudo generar el archivo. Probá desde otro navegador."; ui.msgType="err"; }
  renderAdmin();
}

/* ------------------------------ boot ------------------------------ */
document.addEventListener("input", onInput);
document.addEventListener("change", onChange);
document.addEventListener("click", onClick);
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ if(ui.open){ closeDetail(); return; } if(ui.adminOpen){ ui.adminOpen=false; ui.editing=null; render(); return; } }
  if(ui.open && !ui.adminOpen && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ var n=fotos(vehById(ui.open)).length; if(n>1){ ui.gi=(ui.gi+(e.key==="ArrowRight"?1:-1)+n)%n; renderDetail(); } }
});
function fromHash(){
  var hsh=location.hash||"";
  if(/admin/i.test(hsh) && !ui.canEdit){ ui.standalone=true; ui.canEdit=true; loadDraft(); ui.adminOpen=true; render(); return; }
  var m=hsh.match(/^#v=(.+)$/); if(m && vehById(decodeURIComponent(m[1]))){ ui.open=decodeURIComponent(m[1]); ui.gi=0; renderDetail(); }
}
render();
fromHash();
window.addEventListener("hashchange", fromHash);
})();
</script>
</body></html>
